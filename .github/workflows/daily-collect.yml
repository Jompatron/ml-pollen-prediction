name: Daily Pollen Data Collection

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC (08:00 Stockholm)
    - cron: '0 18 * * *'  # 18:00 UTC (20:00 Stockholm)
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect pollen data
        run: PYTHONPATH=. python -m jobs.daily_collect

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/data/
          git add artifacts/metrics/
          git diff --cached --quiet || git commit -m "data: pollen collection $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
